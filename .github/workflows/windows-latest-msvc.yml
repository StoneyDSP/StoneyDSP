name: windows

on:
  push:
  workflow_dispatch:

concurrency:
  group: windows-latest-msvc-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 3
  CMAKE_INSTALL_PARALLEL_LEVEL: 3
  VCPKG_MAX_CONCURRENCY: 3
  VCPKG_MANIFEST_MODE: ON
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
  VCPKG_BINARY_SOURCES: "clear;default,readwrite"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  windows:
    name: windows (MSVC_${{ matrix.arch }})
    runs-on: windows-latest

    strategy:
      matrix:
        arch: [x86, x64]
          # [x86_amd64, x86_arm, x86_arm64, amd64_x86, amd64_arm, amd64_arm64]

    defaults:
      run:
        shell: pwsh

    steps:

    - name: Enable GitHub Actions Cache backend
      uses: actions/github-script@v8
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Checkout source code
      uses: actions/checkout@v6
      with:
        submodules: true
        fetch-depth: 0

    - name: Set up MSVC environment (x64)
      if: matrix.arch == 'x64'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Set up MSVC environment (x86)
      if: matrix.arch == 'x86'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Prepare vcpkg cache directories
      run: |
        New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE
        New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS

    - name: Restore vcpkg caches
      id: vcpkg-cache
      continue-on-error: true
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          ${{ env.VCPKG_DOWNLOADS }}
        key: vcpkg-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'dep/vcpkg-registry/**') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'dep/vcpkg-registry/**') }}

    - name: version check
      shell: pwsh
      run: node ./scripts/bump-version.mjs --check

    - name: Configure with MSVC x64
      if: matrix.arch == 'x64'
      run: |
        cmake --preset x64-msvc-windows -DSTONEYDSP_BUILD_CORE=ON -DSTONEYDSP_BUILD_TEST=ON -DSTONEYDSP_GENERATE_VERSIONS=OFF

    - name: Configure with MSVC x86
      if: matrix.arch == 'x86'
      run: |
        cmake --preset x86-msvc-windows -DSTONEYDSP_BUILD_CORE=ON -DSTONEYDSP_BUILD_TEST=ON -DSTONEYDSP_GENERATE_VERSIONS=OFF

    - name: Build with MSVC
      run: cmake --build build --config Release --parallel 3

    - name: Test with MSVC
      run: ctest --test-dir build -C Release --output-on-failure
