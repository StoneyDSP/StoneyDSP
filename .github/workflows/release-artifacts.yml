name: release artifacts

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Tag, commit, or branch to build
        required: true
        type: string
      targets:
        description: Comma-separated release target IDs
        required: true
        type: string
        default: linux-x64,linux-arm64,macos-x64,macos-arm64,windows-msvc-x64,windows-mingw-x64
      promote:
        description: Attach matching assets to an existing GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Existing vX.Y.Z GitHub Release tag (required for promotion)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    release-artifacts-${{ inputs.release_ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: validate release request
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      epoch: ${{ steps.release.outputs.epoch }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      vcpkg_commit: ${{ steps.release.outputs.vcpkg_commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref }}
          submodules: true
          fetch-depth: 0

      - name: Test release tooling
        run: >-
          node --test
          scripts/package-release.test.mjs
          scripts/promote-release-assets.test.mjs

      - name: Validate version metadata
        run: node scripts/bump-version.mjs --check

      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          commit=$(git rev-parse HEAD)
          epoch=$(git show -s --format=%ct HEAD)
          vcpkg_commit=$(git -C dep/vcpkg rev-parse HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "vcpkg_commit=$vcpkg_commit" >> "$GITHUB_OUTPUT"

      - name: Validate promotion request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Promotion requires release_tag=v$VERSION; received '$RELEASE_TAG'." >&2
            exit 1
          fi

      - name: Validate promotion tag identity
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          tag_commit=$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)
          if [[ "$tag_commit" != "$COMMIT" ]]; then
            echo "Release tag $RELEASE_TAG does not resolve to built commit $COMMIT." >&2
            exit 1
          fi

      - name: Validate existing GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --silent

      - name: Select published target matrix
        id: matrix
        shell: bash
        env:
          REQUESTED_TARGETS: ${{ inputs.targets || 'linux-x64,linux-arm64,macos-x64,macos-arm64,windows-msvc-x64,windows-mingw-x64' }}
        run: |
          set -euo pipefail
          catalog='[
            {"id":"linux-x64","runner":"ubuntu-24.04","kind":"unix","system":"linux","architecture":"x86_64","compiler":"gcc","cc":"gcc","cxx":"g++","preset":"x64-linux-release","configureArgs":"","format":"tar.gz","assetSuffix":"linux-x86_64-gcc-static"},
            {"id":"linux-arm64","runner":"ubuntu-24.04-arm","kind":"unix","system":"linux","architecture":"arm64","compiler":"gcc","cc":"gcc","cxx":"g++","preset":"arm64-linux-release","configureArgs":"","format":"tar.gz","assetSuffix":"linux-arm64-gcc-static"},
            {"id":"macos-x64","runner":"macos-15-intel","kind":"unix","system":"macos","architecture":"x86_64","compiler":"clang","cc":"clang","cxx":"clang++","preset":"x64-osx-release","configureArgs":"","format":"tar.gz","assetSuffix":"macos-x86_64-clang-static"},
            {"id":"macos-arm64","runner":"macos-15","kind":"unix","system":"macos","architecture":"arm64","compiler":"clang","cc":"clang","cxx":"clang++","preset":"arm64-osx-release","configureArgs":"-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0","format":"tar.gz","assetSuffix":"macos-arm64-clang-static"},
            {"id":"windows-msvc-x64","runner":"windows-2025","kind":"msvc","system":"windows","architecture":"x64","compiler":"msvc-md","cc":"","cxx":"","preset":"x64-msvc-windows","configureArgs":"-DCMAKE_BUILD_TYPE=Release","format":"zip","assetSuffix":"windows-x64-msvc-md-static"},
            {"id":"windows-mingw-x64","runner":"windows-2025","kind":"mingw","system":"windows","architecture":"x64","compiler":"mingw","cc":"","cxx":"","preset":"x64-windows-release","configureArgs":"","format":"zip","assetSuffix":"windows-x64-mingw-static"}
          ]'
          requested=${REQUESTED_TARGETS//[[:space:]]/}
          if [[ -z "$requested" ]]; then
            echo "At least one release target is required." >&2
            exit 1
          fi
          selected='[]'
          seen=','
          IFS=',' read -r -a target_ids <<< "$requested"
          for target_id in "${target_ids[@]}"; do
            if [[ -z "$target_id" || "$seen" == *",$target_id,"* ]]; then
              echo "Release target IDs must be non-empty and unique: '$target_id'." >&2
              exit 1
            fi
            row=$(jq -ce --arg id "$target_id" '.[] | select(.id == $id)' <<< "$catalog") || {
              echo "Unknown release target '$target_id'." >&2
              exit 1
            }
            selected=$(jq -c --argjson row "$row" '. + [$row]' <<< "$selected")
            seen+="$target_id,"
          done
          matrix=$(jq -c '{include: .}' <<< "$selected")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.id }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
    uses: ./.github/workflows/release-build-target.yml
    with:
      target_id: ${{ matrix.id }}
      runner: ${{ matrix.runner }}
      kind: ${{ matrix.kind }}
      system: ${{ matrix.system }}
      architecture: ${{ matrix.architecture }}
      compiler: ${{ matrix.compiler }}
      cc: ${{ matrix.cc }}
      cxx: ${{ matrix.cxx }}
      preset: ${{ matrix.preset }}
      configure_args: ${{ matrix.configureArgs }}
      archive_format: ${{ matrix.format }}
      asset_suffix: ${{ matrix.assetSuffix }}
      commit: ${{ needs.plan.outputs.commit }}
      source_date_epoch: ${{ needs.plan.outputs.epoch }}
      version: ${{ needs.plan.outputs.version }}
      vcpkg_commit: ${{ needs.plan.outputs.vcpkg_commit }}

  promote:
    name: promote assets to GitHub Release
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.promote &&
      needs.plan.result == 'success' && needs.build.result == 'success' }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Checkout resolved release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0

      - name: Recheck release tag identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -euo pipefail
          tag_commit=$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)
          if [[ "$tag_commit" != "$COMMIT" ]]; then
            echo "Release tag $RELEASE_TAG no longer resolves to built commit $COMMIT." >&2
            exit 1
          fi

      - name: Download selected release archives
        uses: actions/download-artifact@v8
        with:
          pattern: StoneyDSP-${{ needs.plan.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Verify archive checksums
        working-directory: dist
        shell: bash
        run: sha256sum --check --strict *.sha256

      - name: Attach non-conflicting assets to existing release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/promote-release-assets.mjs
          --repository "${{ github.repository }}"
          --tag "${{ inputs.release_tag }}"
          --assets-dir dist
