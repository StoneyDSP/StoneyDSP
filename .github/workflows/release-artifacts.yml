name: release artifacts

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Tag, commit, or branch to build
        required: true
        type: string
      targets:
        description: Comma-separated release target IDs
        required: true
        type: string
        default: linux-x64,linux-arm64,macos-x64,macos-arm64,windows-msvc-x64,windows-mingw-x64
      promote:
        description: Attach matching assets to an existing GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Existing vX.Y.Z GitHub Release tag (required for promotion)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ inputs.release_ref }}
  cancel-in-progress: false

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 3
  CMAKE_INSTALL_PARALLEL_LEVEL: 3
  VCPKG_MAX_CONCURRENCY: 3
  VCPKG_MANIFEST_MODE: ON
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
  VCPKG_BINARY_SOURCES: clear;default,readwrite

jobs:
  plan:
    name: validate release request
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      epoch: ${{ steps.release.outputs.epoch }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_ref }}
          submodules: true
          fetch-depth: 0

      - name: Test release tooling
        run: >-
          node --test
          scripts/package-release.test.mjs
          scripts/promote-release-assets.test.mjs

      - name: Resolve release identity
        id: release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bump-version.mjs --check
          version=$(tr -d '[:space:]' < VERSION)
          commit=$(git rev-parse HEAD)
          epoch=$(git show -s --format=%ct HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"

      - name: Validate promotion target
        if: ${{ inputs.promote }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Promotion requires release_tag=v$VERSION; received '$RELEASE_TAG'." >&2
            exit 1
          fi
          tag_commit=$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)
          if [[ "$tag_commit" != "$COMMIT" ]]; then
            echo "Release tag $RELEASE_TAG does not resolve to built commit $COMMIT." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --silent

      - name: Select published target matrix
        id: matrix
        shell: bash
        env:
          REQUESTED_TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          catalog='[
            {"id":"linux-x64","runner":"ubuntu-24.04","kind":"unix","system":"linux","architecture":"x86_64","compiler":"gcc","preset":"x64-linux-release","format":"tar.gz","assetSuffix":"linux-x86_64-gcc-static"},
            {"id":"linux-arm64","runner":"ubuntu-24.04-arm","kind":"unix","system":"linux","architecture":"arm64","compiler":"gcc","preset":"arm64-linux-release","format":"tar.gz","assetSuffix":"linux-arm64-gcc-static"},
            {"id":"macos-x64","runner":"macos-15-intel","kind":"unix","system":"macos","architecture":"x86_64","compiler":"clang","preset":"x64-osx-release","format":"tar.gz","assetSuffix":"macos-x86_64-clang-static"},
            {"id":"macos-arm64","runner":"macos-15","kind":"unix","system":"macos","architecture":"arm64","compiler":"clang","preset":"arm64-osx-release","format":"tar.gz","assetSuffix":"macos-arm64-clang-static"},
            {"id":"windows-msvc-x64","runner":"windows-2025","kind":"msvc","system":"windows","architecture":"x64","compiler":"msvc-md","preset":"x64-msvc-windows","format":"zip","assetSuffix":"windows-x64-msvc-md-static"},
            {"id":"windows-mingw-x64","runner":"windows-2025","kind":"mingw","system":"windows","architecture":"x64","compiler":"mingw","preset":"x64-windows-release","format":"zip","assetSuffix":"windows-x64-mingw-static"}
          ]'
          requested=${REQUESTED_TARGETS//[[:space:]]/}
          if [[ -z "$requested" ]]; then
            echo "At least one release target is required." >&2
            exit 1
          fi
          selected='[]'
          seen=','
          IFS=',' read -r -a target_ids <<< "$requested"
          for target_id in "${target_ids[@]}"; do
            if [[ -z "$target_id" || "$seen" == *",$target_id,"* ]]; then
              echo "Release target IDs must be non-empty and unique: '$target_id'." >&2
              exit 1
            fi
            row=$(jq -ce --arg id "$target_id" '.[] | select(.id == $id)' <<< "$catalog") || {
              echo "Unknown release target '$target_id'." >&2
              exit 1
            }
            selected=$(jq -c --argjson row "$row" '. + [$row]' <<< "$selected")
            seen+="$target_id,"
          done
          matrix=$(jq -c '{include: .}' <<< "$selected")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.id }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout resolved release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.commit }}
          submodules: true
          fetch-depth: 0

      - name: Set up MSVC x64
        if: ${{ matrix.kind == 'msvc' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up MinGW x64
        if: ${{ matrix.kind == 'mingw' }}
        uses: msys2/setup-msys2@v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            --needed
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Select Unix compiler
        if: ${{ matrix.kind == 'unix' }}
        shell: bash
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Prepare vcpkg cache directories on Unix
        if: ${{ matrix.kind == 'unix' }}
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" "$VCPKG_DOWNLOADS"

      - name: Prepare vcpkg cache directories on Windows
        if: ${{ matrix.kind != 'unix' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS

      - name: Restore and save vcpkg caches
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
            ${{ env.VCPKG_DOWNLOADS }}
          key: release-vcpkg-${{ matrix.id }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'dep/vcpkg-registry/**') }}

      - name: Configure, build, test, and install on Unix
        if: ${{ matrix.kind == 'unix' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bump-version.mjs --check
          platform_args=()
          if [[ "${{ matrix.id }}" == "macos-arm64" ]]; then
            platform_args+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0")
          fi
          cmake --preset "${{ matrix.preset }}" \
            -DSTONEYDSP_BUILD_SHARED=OFF \
            -DSTONEYDSP_BUILD_TEST=ON \
            -DSTONEYDSP_TEST_TARGET_INSTALL=OFF \
            -DSTONEYDSP_TEST_CATCH2_SESSION_TARGET_INSTALL=OFF \
            "${platform_args[@]}"
          cmake --build build --config Release --parallel 3
          ctest --test-dir build -C Release -E benchmark --output-on-failure
          cmake --install build --config Release --prefix install
          cmake -S test/consumer -B build-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-consumer --config Release --parallel 3
          ctest --test-dir build-consumer -C Release --output-on-failure

          cmake --preset "${{ matrix.preset }}" -B build-shared \
            -DSTONEYDSP_BUILD_SHARED=ON \
            -DSTONEYDSP_BUILD_TEST=ON \
            -DSTONEYDSP_TEST_TARGET_INSTALL=OFF \
            -DSTONEYDSP_TEST_CATCH2_SESSION_TARGET_INSTALL=OFF \
            "${platform_args[@]}"
          cmake --build build-shared --config Release --parallel 3
          ctest --test-dir build-shared -C Release -E benchmark --output-on-failure
          cmake --install build-shared --config Release --prefix install-shared
          cmake -S test/consumer -B build-consumer-shared -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install-shared"
          cmake --build build-consumer-shared --config Release --parallel 3
          if [[ "${{ matrix.system }}" == "macos" ]]; then
            DYLD_LIBRARY_PATH="$PWD/install-shared/lib:${DYLD_LIBRARY_PATH:-}" \
              ctest --test-dir build-consumer-shared -C Release --output-on-failure
          else
            LD_LIBRARY_PATH="$PWD/install-shared/lib:${LD_LIBRARY_PATH:-}" \
              ctest --test-dir build-consumer-shared -C Release --output-on-failure
          fi

      - name: Configure, build, test, and install with MinGW
        if: ${{ matrix.kind == 'mingw' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          node scripts/bump-version.mjs --check
          cmake --preset "${{ matrix.preset }}" \
            -DSTONEYDSP_BUILD_SHARED=OFF \
            -DSTONEYDSP_BUILD_TEST=ON \
            -DSTONEYDSP_TEST_TARGET_INSTALL=OFF \
            -DSTONEYDSP_TEST_CATCH2_SESSION_TARGET_INSTALL=OFF
          cmake --build build --config Release --parallel 3
          ctest --test-dir build -C Release -E benchmark --output-on-failure
          cmake --install build --config Release --prefix install
          cmake -S test/consumer -B build-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build build-consumer --config Release --parallel 3
          ctest --test-dir build-consumer -C Release --output-on-failure

          cmake --preset "${{ matrix.preset }}" -B build-shared \
            -DSTONEYDSP_BUILD_SHARED=ON \
            -DSTONEYDSP_BUILD_TEST=ON \
            -DSTONEYDSP_TEST_TARGET_INSTALL=OFF \
            -DSTONEYDSP_TEST_CATCH2_SESSION_TARGET_INSTALL=OFF
          cmake --build build-shared --config Release --parallel 3
          ctest --test-dir build-shared -C Release -E benchmark --output-on-failure
          cmake --install build-shared --config Release --prefix install-shared
          cmake -S test/consumer -B build-consumer-shared -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install-shared"
          cmake --build build-consumer-shared --config Release --parallel 3
          PATH="$PWD/install-shared/bin:$PATH" \
            ctest --test-dir build-consumer-shared -C Release --output-on-failure

      - name: Configure, build, test, and install with MSVC
        if: ${{ matrix.kind == 'msvc' }}
        shell: pwsh
        run: |
          node scripts/bump-version.mjs --check
          cmake --preset "${{ matrix.preset }}" `
            -DCMAKE_BUILD_TYPE=Release `
            -DSTONEYDSP_BUILD_SHARED=OFF `
            -DSTONEYDSP_BUILD_TEST=ON `
            -DSTONEYDSP_TEST_TARGET_INSTALL=OFF `
            -DSTONEYDSP_TEST_CATCH2_SESSION_TARGET_INSTALL=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release -E benchmark --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build --config Release --prefix install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S test/consumer -B build-consumer -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$PWD/install"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-consumer --config Release --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-consumer -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmake --preset "${{ matrix.preset }}" -B build-shared `
            -DCMAKE_BUILD_TYPE=Release `
            -DSTONEYDSP_BUILD_SHARED=ON `
            -DSTONEYDSP_BUILD_TEST=ON `
            -DSTONEYDSP_TEST_TARGET_INSTALL=OFF `
            -DSTONEYDSP_TEST_CATCH2_SESSION_TARGET_INSTALL=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-shared --config Release --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-shared -C Release -E benchmark --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build-shared --config Release --prefix install-shared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S test/consumer -B build-consumer-shared -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$PWD/install-shared"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-consumer-shared --config Release --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$PWD/install-shared/bin;$env:PATH"
          ctest --test-dir build-consumer-shared -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package deterministic SDK archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          asset_name="StoneyDSP-${{ needs.plan.outputs.version }}-${{ matrix.assetSuffix }}"
          node scripts/package-release.mjs \
            --install-dir install \
            --output-dir dist \
            --name "$asset_name" \
            --format "${{ matrix.format }}" \
            --version "${{ needs.plan.outputs.version }}" \
            --commit "${{ needs.plan.outputs.commit }}" \
            --system "${{ matrix.system }}" \
            --architecture "${{ matrix.architecture }}" \
            --compiler "${{ matrix.compiler }}" \
            --linkage static \
            --preset "${{ matrix.preset }}" \
            --source-date-epoch "${{ needs.plan.outputs.epoch }}"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"

      - name: Upload release archive for inspection
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.asset_name }}
          path: |
            dist/${{ steps.package.outputs.asset_name }}.*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false

  promote:
    name: promote assets to GitHub Release
    if: ${{ inputs.promote && needs.plan.result == 'success' && needs.build.result == 'success' }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Checkout resolved release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0

      - name: Recheck release tag identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          set -euo pipefail
          tag_commit=$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)
          if [[ "$tag_commit" != "$COMMIT" ]]; then
            echo "Release tag $RELEASE_TAG no longer resolves to built commit $COMMIT." >&2
            exit 1
          fi

      - name: Download selected release archives
        uses: actions/download-artifact@v8
        with:
          pattern: StoneyDSP-${{ needs.plan.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Verify archive checksums
        working-directory: dist
        shell: bash
        run: sha256sum --check --strict *.sha256

      - name: Attach non-conflicting assets to existing release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/promote-release-assets.mjs
          --repository "${{ github.repository }}"
          --tag "${{ inputs.release_tag }}"
          --assets-dir dist
