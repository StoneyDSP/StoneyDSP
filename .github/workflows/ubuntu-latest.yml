name: ubuntu

on:
  # Runs on all pushes
  push:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# When pushing new commits, cancel any running builds on that branch
concurrency:
  group: ubuntu-latest-${{ github.ref }}
  cancel-in-progress: true

env:
  DISPLAY: :0
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CMAKE_BUILD_PARALLEL_LEVEL: 3
  CMAKE_INSTALL_PARALLEL_LEVEL: 3
  VCPKG_MAX_CONCURRENCY: 3
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
  VCPKG_BINARY_SOURCES: "clear;default,readwrite"

jobs:
  ubuntu:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:

    # https://vcvrack.com/manual/Building#Setting-up-your-development-environment
    - name: Install System Deps
      shell: bash
      run: |
        sudo apt-get update
        sudo apt install coreutils unzip git gdb valgrind cmake jq zstd pkg-config ninja-build ccache tree

    - name: Set up compiler
      run: |
        if [ "${{ matrix.compiler }}" == "gcc" ]; then
          sudo apt-get install -y gcc
        elif [ "${{ matrix.compiler }}" == "clang" ]; then
          sudo apt-get install -y clang
        fi

    - name: Configure compiler
      run: |
        if [ "${{ matrix.compiler }}" == "gcc" ]; then
          export CC=gcc
          export CXX=g++
        elif [ "${{ matrix.compiler }}" == "clang" ]; then
          export CC=clang
          export CXX=clang++
        fi

    - name: checkout StoneyDSP
      uses: actions/checkout@v6
      with:
        submodules: true
        fetch-depth: 0

    - name: version check
      shell: bash
      run: make version-check

    - name: Prepare vcpkg cache directories
      shell: bash
      run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" "$VCPKG_DOWNLOADS"

    - name: Restore vcpkg caches
      id: vcpkg-cache
      continue-on-error: true
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          ${{ env.VCPKG_DOWNLOADS }}
        key: vcpkg-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'dep/vcpkg-registry/**') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ matrix.compiler }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'dep/vcpkg-registry/**') }}-

    # Developer workflow

    - name: make workflow
      shell: bash
      run: make workflow

    # Deployment workflow

    - name: make
      shell: bash
      run: >-
        make
        BUILD_CORE=1
        BUILD_DSP=1
        BUILD_TEST=1

    - name: make check
      shell: bash
      run: >-
        make check
        BUILD_CORE=1
        BUILD_DSP=1
        BUILD_TEST=1
        TEST_ARGS="--skip-benchmarks --order decl --warn UnmatchedTestSpec"

    # List all artefact directories

    - name: tree
      shell: bash
      run: |
        tree ${{ github.workspace }}/install

    - name: Save vcpkg caches
      if: success() && steps.vcpkg-cache.outcome != 'failure'
      continue-on-error: true
      uses: actions/cache/save@v5
      with:
        path: |
          ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          ${{ env.VCPKG_DOWNLOADS }}
        key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
