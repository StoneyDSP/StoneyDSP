# Simple workflow for deploying static content to GitHub Pages
name: GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["production"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CMAKE_BUILD_PARALLEL_LEVEL: 3
  CMAKE_INSTALL_PARALLEL_LEVEL: 3
  VCPKG_MAX_CONCURRENCY: 3
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
  VCPKG_BINARY_SOURCES: "clear;default,readwrite"

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:

      - name: checkout StoneyDSP
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Prepare vcpkg cache directories
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" "$VCPKG_DOWNLOADS"

      - name: Restore vcpkg caches
        id: vcpkg-cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
            ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-${{ runner.os }}-docs-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'dep/vcpkg-registry/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-docs-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'dep/vcpkg-registry/**') }}-

      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt install coreutils make vim doxygen pkg-config ninja-build cmake graphviz ccache

      - name: Configure StoneyDSP
        working-directory: ${{ github.workspace }}
        run: |
          make configure BUILD_CORE=1

      - name: Make Doxygen
        working-directory: ${{ github.workspace }}
        run: |
          make doc BUILD_CORE=1

      - name: Save vcpkg caches
        if: success() && steps.vcpkg-cache.outcome != 'failure'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
            ${{ env.VCPKG_DOWNLOADS }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Upload HTML
          path: '${{ github.workspace }}/build/doc/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
